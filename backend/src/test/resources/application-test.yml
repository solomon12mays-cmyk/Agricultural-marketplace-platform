spring:
  datasource:
    url: jdbc:h2:mem:agricultural_marketplace_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: marketplace
  flyway:
    default-schema: marketplace
    schemas: marketplace
    locations: classpath:db/migration

logging:
  level:
    com.agricultural.marketplace: INFO
    org.testcontainers: WARN
